<!doctype html>
<html lang="en">
<head>

<style>:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --text: #1c2333;
  --muted: #5b6577;
  --line: #e4e8ef;
  --accent: #0e8af0;
  --accent-dark: #0a6fc0;
  --danger: #e5484d;
  --navy: #26314f;
  --radius: 16px;
  --shadow: 0 10px 30px rgba(38, 49, 79, 0.10);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.65;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

img, svg, canvas { display: block; max-width: 100%; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

.site-header {
  background: rgba(255,255,255,0.92);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}

.header-inner {
  max-width: 1000px; margin: 0 auto;
  min-height: 52px; padding: 6px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}

.brand {
  display: inline-flex; align-items: center; gap: 8px;
  font-weight: 800; letter-spacing: 0.02em; color: var(--navy);
  font-size: 1.05rem; white-space: nowrap;
}
.brand:hover { text-decoration: none; }

.brand-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #64779f, #26314f);
  box-shadow: 0 0 0 3px rgba(38,49,79,0.12);
}

.lang-nav { display: flex; align-items: center; gap: 4px; }

.lang-link {
  padding: 6px 10px; border-radius: 999px;
  color: var(--muted); font-size: 0.9rem; font-weight: 600;
}
.lang-link:hover { background: #eef2f7; text-decoration: none; color: var(--text); }
.lang-link[aria-current="page"] { background: var(--navy); color: #fff; }

.page-wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 56px; }

main { display: block; }

.hero { text-align: center; padding: 14px 0 6px; }
.hero h1 { margin: 0; font-size: clamp(1.35rem, 4.5vw, 1.9rem); line-height: 1.25; color: var(--navy); letter-spacing: -0.01em; }
.hero .tagline { margin: 6px 0 0; color: var(--muted); font-size: 0.98rem; }

.game-shell { width: 100%; max-width: 560px; margin: 12px auto 0; }

.game-zone {
  position: relative; width: 100%;
  width: min(100%, calc(100vh - 150px));
  width: min(100%, calc(100dvh - 150px));
  aspect-ratio: 1 / 1;
  margin: 0 auto;
  background: radial-gradient(circle at 50% 42%, #ffffff 0%, #f0f3f8 70%, #e8edf5 100%);
  border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
  touch-action: none; user-select: none; -webkit-user-select: none;
}

#coreball-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  touch-action: none; cursor: pointer;
}

.game-overlay {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  background: rgba(247, 248, 250, 0.78);
  padding: 14px;
}
.overlay-hidden { display: none !important; }

.level-banner {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(38,49,79,0.92); color: #fff; font-weight: 800;
  padding: 6px 16px; border-radius: 999px; font-size: 0.95rem;
  pointer-events: none; z-index: 6;
  animation: banner-fade 0.95s ease forwards;
}
@keyframes banner-fade {
  0% { opacity: 0; transform: translate(-50%, -8px); }
  12% { opacity: 1; transform: translate(-50%, 0); }
  75% { opacity: 1; }
  100% { opacity: 0; }
}

.toast-hold { animation: none; opacity: 1; }
.toast-success { background: rgba(18, 165, 148, 0.94); box-shadow: 0 6px 18px rgba(18, 165, 148, 0.3); }
.retry-toast {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
  background: rgba(229, 72, 77, 0.94); color: #fff; font-weight: 800;
  padding: 10px 22px; border-radius: 999px; font-size: 1rem;
  pointer-events: none; z-index: 6; white-space: nowrap;
  animation: toast-fade 1.5s ease forwards;
  box-shadow: 0 6px 18px rgba(38, 49, 79, 0.25);
}
@keyframes toast-fade {
  0% { opacity: 0; transform: translate(-50%, -44%); }
  10% { opacity: 1; transform: translate(-50%, -50%); }
  80% { opacity: 1; }
  100% { opacity: 0; }
}
.overlay-panel {
  text-align: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 14px 40px rgba(38,49,79,0.16);
  padding: 22px 20px; max-width: 320px; width: 100%;
}
.overlay-panel h2 { margin: 0 0 6px; font-size: 1.25rem; color: var(--navy); }
.overlay-panel p { margin: 0 0 14px; color: var(--muted); font-size: 0.95rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent; border-radius: 999px;
  padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer;
  min-height: 42px; color: var(--text); background: #eef2f7;
  transition: background 0.15s ease, transform 0.05s ease;
}
.btn:hover { background: #e2e8f0; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:disabled:hover { background: #eef2f7; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 3px solid rgba(14,138,240,0.4); outline-offset: 2px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #cf3c41; }
.overlay-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
.overlay-actions .btn { flex: 1 1 auto; min-width: 120px; }

.game-status { margin-top: 10px; }

.hud {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; font-weight: 700; color: var(--navy); font-size: 0.95rem;
}
.hud .muted { color: var(--muted); font-weight: 500; }
.hud-dots { color: var(--accent); font-size: 0.82rem; letter-spacing: 0.18em; white-space: nowrap; }

.progress-track { height: 8px; background: #e6ebf2; border-radius: 999px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #12a594, #0e8af0); border-radius: 999px; transition: width 0.15s ease; }

.game-actions { display: flex; gap: 8px; margin-top: 10px; }
.game-actions .btn { flex: 1; }
.game-actions #btn-restart { flex: 0 0 auto; min-width: 46px; }

.hint { margin: 8px 0 0; color: var(--muted); font-size: 0.86rem; text-align: center; }

.content { padding-top: 26px; }
.content h2 { font-size: 1.35rem; color: var(--navy); margin: 1.7em 0 0.5em; }
.content h2:first-child { margin-top: 0.6em; }
.content h3 { font-size: 1.08rem; color: var(--navy); margin: 1.4em 0 0.4em; }
.content p, .content li { color: #313a4d; }
.content ul, .content ol { padding-left: 1.25em; margin: 0.6em 0; }
.content li { margin: 0.32em 0; }
.content .sources { font-size: 0.92rem; color: var(--muted); }
.content .sources a { color: var(--muted); text-decoration: underline; }
.content .lead { font-size: 1.02rem; color: var(--muted); }

.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.card h3 { margin: 0 0 8px; font-size: 1.15rem; }
.card p { margin: 0 0 12px; color: var(--muted); font-size: 0.95rem; }
.card .btn { padding: 8px 14px; min-height: 36px; font-size: 0.9rem; }

.ad-slot {
  min-height: 280px;
  display: flex; align-items: center; justify-content: center;
  background: #eef1f6; border: 1px dashed #cdd6e2; border-radius: 12px;
  color: #8a94a8; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase;
  margin: 26px 0; overflow: hidden;
}
.ad-slot--compact { min-height: 120px; }
.native-ad {
  max-width: 560px; margin: 18px auto 0; min-height: 100px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: #ffffff; border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 8px; overflow: hidden;
}
.native-ad .ad-label { font-size: 0.7rem; color: #8a94a8; letter-spacing: 0.08em; text-transform: uppercase; }
.native-ad > div { width: 100%; }

.faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; margin: 8px 0; }
.faq summary { cursor: pointer; font-weight: 700; color: var(--navy); padding: 13px 0; list-style-position: inside; }
.faq details[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.faq .a { padding: 2px 0 14px; color: #313a4d; }

.breadcrumbs { font-size: 0.85rem; color: var(--muted); margin: 14px 0 0; }
.breadcrumbs a { color: var(--muted); }
.breadcrumbs span { margin: 0 6px; }

.legal { max-width: 760px; }
.legal h1 { margin: 0.4em 0 0.4em; font-size: 1.6rem; color: var(--navy); }
.legal h2 { margin-top: 1.5em; }

.site-footer { border-top: 1px solid var(--line); background: var(--surface); margin-top: 40px; }
.footer-inner { max-width: 1000px; margin: 0 auto; padding: 26px 16px 34px; }
.footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 22px; }
.footer-col h3 { font-size: 0.95rem; color: var(--navy); margin: 0 0 8px; }
.footer-col ul { list-style: none; margin: 0; padding: 0; }
.footer-col li { margin: 5px 0; }
.footer-col a { color: var(--muted); font-size: 0.92rem; }
.footer-author { margin: 8px 0 0; color: var(--muted); font-size: 0.82rem; }
.footer-note { margin-top: 22px; color: var(--muted); font-size: 0.82rem; border-top: 1px solid var(--line); padding-top: 14px; }

.modal { border: 0; padding: 0; border-radius: 16px; max-width: 620px; width: calc(100% - 24px); max-height: 80dvh; }
.modal::backdrop { background: rgba(28, 35, 51, 0.5); }
.modal-card { padding: 18px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.modal-head h2 { margin: 0; font-size: 1.1rem; color: var(--navy); }
.icon-btn { border: 0; background: #eef2f7; border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font-size: 1rem; }
.icon-btn:hover { background: #e2e8f0; }
.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px; max-height: 54dvh; overflow: auto; padding: 2px; }
.level-btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 4px; font: inherit; font-size: 0.85rem; cursor: pointer; color: var(--text); }
.level-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.level-btn:focus-visible { outline: 3px solid rgba(14,138,240,0.4); }
.level-btn-done { background: #eafaf4; border-color: #bfe8d8; color: #0f7a57; }
.level-btn-current { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(14,138,240,0.25); font-weight: 800; }
.level-btn-locked { color: #9aa3b5; background: #f1f3f7; cursor: not-allowed; }

body.modal-open { overflow: hidden; }

@media (max-width: 560px) {
  .page-wrap { padding: 0 12px 44px; }
  .header-inner { padding: 6px 12px; }
  .game-zone { border-radius: 14px; }
  .overlay-panel { padding: 18px 16px; }
  .game-actions .btn { padding: 8px 10px; font-size: 0.9rem; min-height: 40px; }
  .ad-slot { min-height: 250px; }
  .content h2 { font-size: 1.22rem; }
}

@media (prefers-reduced-motion: reduce) {
  .progress-fill { transition: none; }
  .level-banner { animation: none; opacity: 0; }
}

@media (prefers-contrast: more) {
  .btn { border: 2px solid currentColor; }
}
</style>
</head>
